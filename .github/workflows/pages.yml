# Publishes the public/ folder to GitHub Pages (https://samatech-lb.github.io/Tawer/).
# Requires: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Note: GitHub Pages only serves static files. The website works (it uses the default
# content in public/content.js), but /admin and saving need Cloudflare Pages (functions/).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
