<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tawer Academy | English Courses for All Ages</title>
  <meta name="description" content="Tawer Academy: English courses for kids, teens and adults, from beginner to advanced. Small classes, certified teachers, in class or online. Free level test and free trial lesson. دورات لغة إنجليزية للأطفال والمراهقين والكبار." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://www.tawer-academy.com/" />
  <link rel="alternate" hreflang="en" href="https://www.tawer-academy.com/?lang=en" />
  <link rel="alternate" hreflang="ar" href="https://www.tawer-academy.com/?lang=ar" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tawer Academy | English Courses for All Ages" />
  <meta property="og:description" content="Small classes, certified teachers, in class or online. Take the free level test and book a free lesson." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b2bd1'/%3E%3Cpath d='M18 20h28v7H35.5v19h-7V27H18z' fill='%23fff'/%3E%3Ccircle cx='46' cy='44' r='5' fill='%23ff7a1a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* Pick language and theme before the page shows, so it never flashes the wrong one.
       Language: saved choice > ?lang= in the URL > Arabic. Theme: saved choice > device setting. */
    (function () {
      var d = document.documentElement, l, th;
      try { l = localStorage.getItem("lang"); th = localStorage.getItem("theme"); } catch (e) {}
      var q = new URLSearchParams(location.search).get("lang");
      if (q === "ar" || q === "en") l = q;
      if (l !== "en") l = "ar";
      if (!th) th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr"; d.dataset.theme = th;
      d.classList.add("js");
      setTimeout(function () { d.classList.add("ready"); }, 1500);
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Tawer Academy",
    "description": "English language academy for kids, teens and adults: general English, conversation, business English and IELTS / TOEFL preparation, from A1 to C1.",
    "url": "https://www.tawer-academy.com/",
    "telephone": "+000 00 000 000",
    "email": "hello@tawer-academy.com",
    "address": { "@type": "PostalAddress", "streetAddress": "Cedar Tower, 3rd floor, Main Street" },
    "openingHours": ["Mo-Fr 09:00-21:00", "Sa 10:00-16:00"]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__in">
      <a href="#top" class="logo" aria-label="Tawer Academy">
        <span class="logo__mark" aria-hidden="true">T</span>
        <span class="logo__text">Tawer<small data-i18n="academy"></small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#courses-section" data-i18n="navCourses"></a>
        <a href="#levels-section" data-i18n="navLevels"></a>
        <a href="#test" data-i18n="navTest"></a>
        <a href="#prices" data-i18n="navPrices"></a>
        <a href="#faq" data-i18n="navFaq"></a>
        <a href="#contact" data-i18n="navContact"></a>
        <a href="#contact" class="btn nav__cta" data-i18n="navCta"></a>
      </nav>
      <div class="header__tools">
        <button type="button" class="lang-btn" id="langBtn"><i class="ri-global-line" aria-hidden="true"></i><span id="langLabel"></span></button>
        <button type="button" class="icon-btn" id="themeBtn"></button>
        <a href="#contact" class="btn btn--sm header__cta" data-i18n="navCta"></a>
        <button type="button" class="icon-btn burger" id="burger" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu"><i class="ri-menu-line" aria-hidden="true"></i></button>
      </div>
    </div>
    <span class="progress" id="progress"></span>
  </header>
  <div class="overlay" id="overlay"></div>

  <main id="main">
    <!-- Hero -->
    <section class="hero" id="top">
      <div class="container hero__in">
        <div class="hero__text">
          <span class="chip chip--accent"><i class="ri-sparkling-2-fill" aria-hidden="true"></i><span data-i18n="heroTag"></span></span>
          <h1 data-i18n="heroTitle"></h1>
          <p class="hero__lead" data-i18n="heroText"></p>
          <div class="hero__btns">
            <a href="#contact" class="btn btn--lg"><span data-i18n="heroBtn1"></span><i class="ri-arrow-right-line flip" aria-hidden="true"></i></a>
            <a href="#test" class="btn btn--lg btn--ghost"><i class="ri-survey-line" aria-hidden="true"></i><span data-i18n="heroBtn2"></span></a>
          </div>
          <div class="trust">
            <span class="stars" aria-hidden="true"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span>
            <span data-i18n="heroTrust"></span>
          </div>
        </div>
        <div class="hero__media">
          <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80" data-i18n-alt="heroImgAlt" alt="" />
          <span class="bubble bubble--1" lang="en" dir="ltr" aria-hidden="true">Hello! 👋</span>
          <span class="bubble bubble--2" lang="en" dir="ltr" aria-hidden="true">I can do it! 💪</span>
          <div class="hero__badge">
            <i class="ri-calendar-event-line" aria-hidden="true"></i>
            <div><small data-i18n="heroNext"></small><b data-i18n="heroDate"></b></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Phrase ribbon (decorative) -->
    <div class="ticker-wrap" aria-hidden="true">
      <div class="ticker" dir="ltr"><div class="ticker__track" id="ticker"></div></div>
    </div>

    <!-- Why us -->
    <section class="section">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="whyTag"></span>
          <h2 data-i18n="whyTitle"></h2>
        </div>
        <div class="features stagger" id="features"></div>
      </div>
    </section>

    <!-- Courses -->
    <section class="section section--soft" id="courses-section">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="coursesTag"></span>
          <h2 data-i18n="coursesTitle"></h2>
          <p data-i18n="coursesText"></p>
        </div>
        <div class="courses stagger" id="courses"></div>
      </div>
    </section>

    <!-- Levels -->
    <section class="section" id="levels-section">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="levelsTag"></span>
          <h2 data-i18n="levelsTitle"></h2>
          <p data-i18n="levelsText"></p>
        </div>
        <ol class="levels stagger" id="levels"></ol>
        <div class="levels__cta">
          <a href="#test" class="btn btn--ghost"><i class="ri-survey-line" aria-hidden="true"></i><span data-i18n="levelsCta"></span></a>
        </div>
      </div>
    </section>

    <!-- Level test -->
    <section class="section section--soft" id="test">
      <div class="container test__in reveal">
        <div class="test__intro">
          <span class="chip" data-i18n="testTag"></span>
          <h2 class="h2" data-i18n="testTitle"></h2>
          <p data-i18n="testText"></p>
          <ul class="perks stagger">
            <li><i class="ri-timer-line" aria-hidden="true"></i><span data-i18n="perk1"></span></li>
            <li><i class="ri-gift-line" aria-hidden="true"></i><span data-i18n="perk2"></span></li>
            <li><i class="ri-bar-chart-2-line" aria-hidden="true"></i><span data-i18n="perk3"></span></li>
          </ul>
        </div>
        <div class="quiz" id="quiz" aria-live="polite"></div>
      </div>
    </section>

    <!-- Steps -->
    <section class="section">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="stepsTag"></span>
          <h2 data-i18n="stepsTitle"></h2>
        </div>
        <ol class="steps stagger" id="steps"></ol>
      </div>
    </section>

    <!-- Reviews -->
    <section class="section section--soft">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="reviewsTag"></span>
          <h2 data-i18n="reviewsTitle"></h2>
        </div>
        <div class="reviews stagger" id="reviews"></div>
      </div>
    </section>

    <!-- Prices -->
    <section class="section" id="prices">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="pricesTag"></span>
          <h2 data-i18n="pricesTitle"></h2>
        </div>
        <div class="plans stagger" id="plans"></div>
        <p class="plans__note"><i class="ri-information-line" aria-hidden="true"></i> <span data-i18n="pricesNote"></span></p>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section section--soft" id="faq">
      <div class="container reveal">
        <div class="head">
          <span class="chip" data-i18n="faqTag"></span>
          <h2 data-i18n="faqTitle"></h2>
        </div>
        <div class="faq stagger" id="faqList"></div>
        <div class="faq__more">
          <p data-i18n="faqMore"></p>
          <a href="#" class="btn btn--wa"><i class="ri-whatsapp-line" aria-hidden="true"></i><span data-i18n="waBtn"></span></a>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="container contact__in reveal">
        <div class="contact__info">
          <span class="chip" data-i18n="contactTag"></span>
          <h2 class="h2" data-i18n="contactTitle"></h2>
          <p data-i18n="contactText"></p>
          <ul class="info">
            <li><i class="ri-phone-line" aria-hidden="true"></i><div><small data-i18n="cPhone"></small><a href="tel:+0000000000" dir="ltr">+000 00 000 000</a></div></li>
            <li><i class="ri-mail-line" aria-hidden="true"></i><div><small data-i18n="cEmail"></small><a href="mailto:hello@tawer-academy.com">hello@tawer-academy.com</a></div></li>
            <li><i class="ri-map-pin-2-line" aria-hidden="true"></i><div><small data-i18n="cAddr"></small><b data-i18n="cAddrVal"></b></div></li>
            <li><i class="ri-time-line" aria-hidden="true"></i><div><small data-i18n="cHours"></small><b data-i18n="cHoursVal"></b></div></li>
          </ul>
          <a href="#" class="btn btn--wa btn--lg"><i class="ri-whatsapp-line" aria-hidden="true"></i><span data-i18n="waBtn"></span></a>
        </div>

        <form class="form" id="trialForm" novalidate>
          <label class="field"><span data-i18n="fName"></span>
            <input name="fullname" autocomplete="name" required data-i18n-ph="fNamePh" />
          </label>
          <label class="field"><span data-i18n="fPhone"></span>
            <input name="phone" type="tel" autocomplete="tel" dir="ltr" required placeholder="+000 00 000 000" />
          </label>
          <div class="form__row">
            <label class="field"><span data-i18n="fCourse"></span><select name="course" id="fCourse"></select></label>
            <label class="field"><span data-i18n="fLevel"></span><select name="level" id="fLevel"></select></label>
          </div>
          <fieldset class="chips">
            <legend data-i18n="fTime"></legend>
            <label><input type="radio" name="time" value="morning" /><span data-i18n="tMorning"></span></label>
            <label><input type="radio" name="time" value="evening" checked /><span data-i18n="tEvening"></span></label>
            <label><input type="radio" name="time" value="weekend" /><span data-i18n="tWeekend"></span></label>
          </fieldset>
          <fieldset class="chips">
            <legend data-i18n="fMode"></legend>
            <label><input type="radio" name="mode" value="class" checked /><span><i class="ri-building-line" aria-hidden="true"></i> <b data-i18n="mClass"></b></span></label>
            <label><input type="radio" name="mode" value="online" /><span><i class="ri-computer-line" aria-hidden="true"></i> <b data-i18n="mOnline"></b></span></label>
          </fieldset>
          <button class="btn btn--lg btn--full" type="submit"><span data-i18n="fSend"></span><i class="ri-send-plane-line flip" aria-hidden="true"></i></button>
          <p class="form__msg" id="formMsg" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__in">
      <div>
        <a href="#top" class="logo" aria-label="Tawer Academy">
          <span class="logo__mark" aria-hidden="true">T</span>
          <span class="logo__text">Tawer<small data-i18n="academy"></small></span>
        </a>
        <p data-i18n="footText"></p>
        <div class="social">
          <a href="#" aria-label="Instagram"><i class="ri-instagram-line" aria-hidden="true"></i></a>
          <a href="#" aria-label="Facebook"><i class="ri-facebook-fill" aria-hidden="true"></i></a>
          <a href="#" aria-label="TikTok"><i class="ri-tiktok-fill" aria-hidden="true"></i></a>
          <a href="#" aria-label="WhatsApp"><i class="ri-whatsapp-line" aria-hidden="true"></i></a>
        </div>
      </div>
      <nav class="footer__links" aria-label="Footer">
        <a href="#courses-section" data-i18n="navCourses"></a>
        <a href="#levels-section" data-i18n="navLevels"></a>
        <a href="#test" data-i18n="navTest"></a>
        <a href="#prices" data-i18n="navPrices"></a>
        <a href="#faq" data-i18n="navFaq"></a>
        <a href="#contact" data-i18n="navContact"></a>
      </nav>
    </div>
    <div class="container footer__bottom">
      © <span id="year">2026</span> Tawer Academy. <span data-i18n="rights"></span>
    </div>
  </footer>

  <a href="#" class="wa-float" aria-label="WhatsApp"><i class="ri-whatsapp-line" aria-hidden="true"></i></a>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
