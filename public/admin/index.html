<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tawer Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b2bd1'/%3E%3Cpath d='M18 20h28v7H35.5v19h-7V27H18z' fill='%23fff'/%3E%3Ccircle cx='46' cy='44' r='5' fill='%23ff7a1a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Login -->
  <section class="login" id="loginView" hidden>
    <form class="login__card" id="loginForm">
      <div class="brand"><span class="brand__mark">T</span><div><b>Tawer Academy</b><small>Content dashboard</small></div></div>
      <label>Admin password
        <div class="pw">
          <input type="password" id="password" autocomplete="current-password" required autofocus />
          <button type="button" id="pwToggle" aria-label="Show password"><i class="ri-eye-line"></i></button>
        </div>
      </label>
      <button class="btn btn--primary btn--full" type="submit" id="loginBtn"><i class="ri-login-box-line"></i> Log in</button>
      <p class="msg" id="loginMsg" role="alert"></p>
      <a class="back" href="/"><i class="ri-arrow-left-line"></i> Back to website</a>
    </form>
  </section>

  <!-- Dashboard -->
  <div class="app" id="appView" hidden>
    <header class="top">
      <div class="brand"><span class="brand__mark">T</span><div><b>Tawer Academy</b><small>Content dashboard</small></div></div>
      <div class="top__status" id="status" aria-live="polite"></div>
      <div class="top__actions">
        <a class="btn btn--ghost" href="/" target="_blank" rel="noopener"><i class="ri-external-link-line"></i><span>View site</span></a>
        <button class="btn btn--ghost" id="historyBtn"><i class="ri-history-line"></i><span>History</span></button>
        <button class="btn btn--primary" id="saveBtn" disabled><i class="ri-save-3-line"></i><span>Save &amp; publish</span></button>
        <button class="btn btn--icon" id="logoutBtn" aria-label="Log out" title="Log out"><i class="ri-logout-box-r-line"></i></button>
      </div>
    </header>
    <div class="layout">
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <main class="panel" id="panel"></main>
    </div>
  </div>

  <!-- History dialog -->
  <dialog class="dialog" id="historyDlg">
    <div class="dialog__head"><h2>Version history</h2><button class="btn btn--icon" data-close aria-label="Close"><i class="ri-close-line"></i></button></div>
    <p class="muted">Every time you save, the previous version is kept (last 10). Loading a version puts it in the editor. Nothing changes on the website until you press <b>Save &amp; publish</b>.</p>
    <div id="historyList" class="history"></div>
    <div class="dialog__foot">
      <button class="btn btn--danger-ghost" id="resetBtn"><i class="ri-restart-line"></i> Load original default content</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="/content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
